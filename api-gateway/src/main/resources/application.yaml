server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**
            - id: auth-oauth2-authorization
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/oauth2/**
            - id: auth-oauth2-callback
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/login/oauth2/**
            - id: task-service
              uri: ${TASK_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/tasks/**,/api/v1/task-group/**

jwt:
  secret: ${JWT_SECRET}