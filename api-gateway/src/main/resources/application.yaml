server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**

            - id: task-service
              uri: ${TASK_SERVICE_URL:http://localhost:8002}
              predicates:
                - Path=/api/v1/tasks/**

jwt:
  secret: ${JWT_SECRET}