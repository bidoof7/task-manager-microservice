name: Task Manager Microservices CI

on:
  push:
    branches: 
      - main
      - 'ci/**'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate Docker Compose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: |
          docker compose \
            --env-file .env.example \
            -f docker-compose.yml \
            config --quiet

  build:
    name: Build - ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: validate

    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - task-service
          - notification-service 
          - email-service

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      - name: Build application without running tests
        working-directory: ${{ matrix.service }}
        run: mvn --batch-mode --no-transfer-progress -DskipTests package

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs:
      - validate
      - build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build all application images
        run: |
          docker compose \
            --env-file .env.example \
            -f docker-compose.yml \
            build --pull
  publish-images:
    name: Publish - ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs:
      - validate
      - build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - task-service
          - notification-service
          - email-service

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare lowercase image name
        id: image
        shell: bash
        run: |
          echo "repository=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.repository }}-${{ matrix.service }}:latest
            ghcr.io/${{ steps.image.outputs.repository }}-${{ matrix.service }}:${{ github.sha }}