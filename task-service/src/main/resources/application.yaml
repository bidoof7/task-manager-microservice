spring:
  application:
    name: task-service

  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1434;databaseName=task_db;encrypt=false;trustServerCertificate=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

  jwt:
    secret: ${JWT_SECRET}

server:
  port: 8082